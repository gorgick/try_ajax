{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta http-equiv="X-UA-Compatible" content="ie=edge">
   <link rel="stylesheet" href="{% static 'css/main.css' %}">
   <title>Галерея изображений на jQuey</title>
</head>
<body>
   <div class="gallery">
      <div class="big">
         <img src="{% static 'images/gallery/start.jpg' %}" alt="Старт" />
      </div>
      <div class="small">
          {% for product in images %}
          <div><a href=""><img class="small-img" src="/media/{{product.image}}" alt=""></a></div>
          {% endfor %}
      </div>
   </div>
</body>
</html>
